<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бүртгэл — DSIF Forum 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAXYu7yseh6J6d21m-Jhiwt-EjVIeU5gQ8",
  authDomain: "dsif-shedule.firebaseapp.com",
  projectId: "dsif-shedule",
  storageBucket: "dsif-shedule.firebasestorage.app",
  messagingSenderId: "973476131387",
  appId: "1:973476131387:web:8c2e1234567890abcdef"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window._dsifSaveRegistration = async function(data) {
  const regNum = 'DSIF-2026-' + (Math.floor(Math.random() * 9000) + 1000);
  const docName = (data.lastname + ' ' + data.firstname).trim() || regNum;
  await setDoc(doc(db, "registrations", docName), { ...data, regNumber: regNum, registeredAt: serverTimestamp() });
  return regNum;
};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;font-weight:300;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}

/* Header */
.page-header{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;border-bottom:1px solid rgba(255,255,255,.07)}
.header-logo{height:36px;width:auto;display:block}
.header-back{font-size:.6rem;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.4);text-transform:uppercase;transition:color .2s}
.header-back:hover{color:#00b352}

/* Main */
.page-main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:48px 24px 64px}
.card{width:100%;max-width:560px}
.card-badge{display:inline-block;padding:6px 18px;border:1px solid rgba(0,179,82,.35);font-size:.55rem;font-weight:700;letter-spacing:3px;color:#00b352;text-transform:uppercase;margin-bottom:20px}
.card-title{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;letter-spacing:-1px;text-transform:uppercase;line-height:1;margin-bottom:6px}
.card-title em{font-style:normal;color:#00b352}
.card-sub{font-size:.65rem;color:rgba(255,255,255,.35);letter-spacing:2px;text-transform:uppercase;margin-bottom:36px}

/* Form */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:.52rem;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.45);margin-bottom:6px;text-transform:uppercase}
.form-input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;font-family:'Montserrat',sans-serif;font-size:.72rem;font-weight:400;padding:10px 14px;outline:none;transition:border .2s;-webkit-appearance:none;appearance:none;border-radius:0}
.form-input:focus{border-color:#00b352}
.form-input option{background:#1a1a1a;color:#fff}
.form-check{display:flex;align-items:flex-start;gap:8px;font-size:.63rem;color:rgba(255,255,255,.4);line-height:1.5;margin-top:4px}
.form-check input{margin-top:2px;accent-color:#00b352}
.hotel-radios{display:flex;gap:16px;margin-bottom:8px}
.hotel-radios label{display:flex;align-items:center;gap:6px;font-size:.65rem;color:rgba(255,255,255,.65);cursor:pointer}
.hotel-radios input{accent-color:#00b352}

/* Submit */
.btn-submit{width:100%;padding:14px;background:#00b352;color:#fff;font-family:'Montserrat',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;border:none;cursor:pointer;transition:background .2s;margin-top:8px}
.btn-submit:hover{background:#00d964}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}

/* Success */
#success-block{display:none;text-align:center;padding:48px 0}
.success-icon{width:60px;height:60px;border:2px solid #00b352;display:flex;align-items:center;justify-content:center;color:#00b352;margin:0 auto 20px}
.success-rows{text-align:left;border:1px solid rgba(255,255,255,.08);padding:16px;margin:20px 0 28px}
.success-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.success-row:last-child{border-bottom:none}
.success-row-key{font-size:.52rem;color:rgba(255,255,255,.3);min-width:110px;letter-spacing:1px;text-transform:uppercase;padding-top:2px}
.success-row-val{font-size:.7rem;font-weight:600;color:#fff}
.btn-home{display:inline-block;padding:12px 32px;background:#00b352;color:#fff;font-family:'Montserrat',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;text-decoration:none}

/* Footer */
.page-footer{padding:20px 40px;border-top:1px solid rgba(255,255,255,.06);font-size:.55rem;color:rgba(255,255,255,.2);letter-spacing:1px;text-transform:uppercase;text-align:center}

@media(max-width:540px){
  .page-header{padding:16px 20px}
  .page-main{padding:32px 20px 48px}
  .form-row{grid-template-columns:1fr}
  .page-footer{padding:16px 20px}
}
</style>
</head>
<body>

<header class="page-header">
  <img src="dsif-logo.png" alt="DSIF 2026" class="header-logo" id="header-logo">
  <a href="index.html" class="header-back">← Үндсэн хуудас</a>
</header>

<main class="page-main">
  <div class="card">
    <div id="form-block">
      <div class="card-badge">DSIF FORUM 2026</div>
      <h1 class="card-title">ФОРУМД<br><em>БҮРТГҮҮЛЭХ</em></h1>
      <p class="card-sub">2026.04.26 — 27 &nbsp;·&nbsp; Сайншанд, Дорноговь</p>

      <form id="reg-form" novalidate>
        <div class="form-row">
          <div class="form-group"><label class="form-label">ОВОГ</label><input id="f-lastname" type="text" class="form-input" placeholder="Овог" required></div>
          <div class="form-group"><label class="form-label">НЭР</label><input id="f-firstname" type="text" class="form-input" placeholder="Нэр" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">УТАС</label><input id="f-phone" type="tel" class="form-input" placeholder="+976 XXXX XXXX" required></div>
          <div class="form-group"><label class="form-label">И-МЭЙЛ</label><input id="f-email" type="email" class="form-input" placeholder="name@example.com" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">БАЙГУУЛЛАГА</label><input id="f-org" type="text" class="form-input" placeholder="Байгууллагын нэр" required></div>
          <div class="form-group"><label class="form-label">АЛБАН ТУШААЛ</label><input id="f-role" type="text" class="form-input" placeholder="Албан тушаал" required></div>
        </div>
        <div class="form-group">
          <label class="form-label">САЛБАР</label>
          <select id="f-sector" class="form-input" required>
            <option value="">— СОНГОНО УУ —</option>
            <option>НОГООН ЭДИЙН ЗАСАГ</option><option>ЭРЧИМ ХҮЧ</option><option>УУЛ УУРХАЙ</option><option>БАЙГАЛЬ ОРЧИН</option><option>ДЭД БҮТЭЦ</option><option>БОЛОВСРОЛ</option><option>СОЁЛ</option><option>ЭРҮҮЛ МЭНД</option><option>НИЙГЭМ</option><option>ХӨДӨӨ АЖ АХУЙ</option><option>БУСАД</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">ОРОЛЦОХ ХЭЛБЭР</label>
          <select id="f-participate" class="form-input" required>
            <option value="">— СОНГОНО УУ —</option>
            <option>ХӨРӨНГӨ ОРУУЛАГЧ</option><option>B2B УУЛЗАЛТ</option><option>ИЛТГЭГЧ / ПАНЕЛИСТ</option><option>ЗОЧИН</option><option>ХЭВЛЭЛ МЭДЭЭЛЭЛ</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">БУУДАЛЫН ЗАХИАЛГА</label>
          <div class="hotel-radios">
            <label><input type="radio" name="hotel" id="f-hotel-yes" value="yes"> Тийм</label>
            <label><input type="radio" name="hotel" id="f-hotel-no" value="no" checked> Үгүй</label>
          </div>
          <div id="hotel-count-wrap" style="display:none">
            <input id="f-hotel-count" type="number" class="form-input" min="1" max="20" placeholder="Хэдэн хүн?" style="width:160px">
          </div>
        </div>
        <div class="form-group"><label class="form-label">НЭМЭЛТ ТЭМДЭГЛЭЛ</label><textarea id="f-notes" class="form-input" rows="3" placeholder="Тусгайлсан хүсэлт, асуулт байвал бичнэ үү..." style="resize:vertical"></textarea></div>
        <label class="form-check"><input type="checkbox" id="f-agree" required> Хувийн мэдээллийг боловсруулахыг зөвшөөрч байна</label>
        <button type="submit" class="btn-submit" id="submit-btn">ИЛГЭЭХ</button>
      </form>
    </div>

    <div id="success-block">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="24" height="24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2 style="font-size:1.2rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">АМЖИЛТТАЙ БҮРТГЭГДЛЭЭ!</h2>
      <p style="font-size:.7rem;color:rgba(255,255,255,.4);margin-bottom:4px">Бүртгэлийн дугаар: <strong id="s-regnum" style="color:#00b352"></strong></p>
      <p style="font-size:.63rem;color:rgba(255,255,255,.25);margin-bottom:20px">Баталгаажуулах и-мэйл илгээгдэнэ.</p>
      <div class="success-rows" id="s-rows"></div>
      <a href="index.html" class="btn-home">ҮНДСЭН ХУУДАС РУУ БУЦАХ</a>
    </div>
  </div>
</main>

<footer class="page-footer">DSIF Forum 2026 &nbsp;·&nbsp; Сайншанд, Дорноговь &nbsp;·&nbsp; 2026.04.26–27</footer>

<script>
// Hotel toggle
document.querySelectorAll('input[name="hotel"]').forEach(r=>{
  r.addEventListener('change',()=>{
    document.getElementById('hotel-count-wrap').style.display=
      document.getElementById('f-hotel-yes').checked?'block':'none';
  });
});

// Form submit
document.getElementById('reg-form').addEventListener('submit',async function(e){
  e.preventDefault();
  const btn=document.getElementById('submit-btn');
  btn.textContent='ИЛГЭЭЖ БАЙНА...';btn.disabled=true;
  const data={
    lastname:document.getElementById('f-lastname').value.trim(),
    firstname:document.getElementById('f-firstname').value.trim(),
    phone:document.getElementById('f-phone').value.trim(),
    email:document.getElementById('f-email').value.trim(),
    org:document.getElementById('f-org').value.trim(),
    role:document.getElementById('f-role').value.trim(),
    sector:document.getElementById('f-sector').value,
    participate:document.getElementById('f-participate').value,
    hotel:document.getElementById('f-hotel-yes').checked?'Тийм':'Үгүй',
    hotelCount:document.getElementById('f-hotel-yes').checked?(document.getElementById('f-hotel-count').value||''):'',
    notes:document.getElementById('f-notes').value.trim(),
  };
  try{
    let regNum;
    if(typeof window._dsifSaveRegistration==='function'){
      regNum=await window._dsifSaveRegistration(data);
    }else{
      await new Promise(r=>setTimeout(r,2000));
      if(typeof window._dsifSaveRegistration==='function'){
        regNum=await window._dsifSaveRegistration(data);
      }else{
        throw new Error('Firebase модуль ачаалагдсангүй. Хуудсаа дахин ачаалаад оролдоно уу.');
      }
    }
    showSuccess(data,regNum);
  }catch(err){
    console.error(err);
    btn.textContent='ИЛГЭЭХ';btn.disabled=false;
    alert('Алдаа гарлаа: '+err.message);
  }
});

function showSuccess(d,regNum){
  document.getElementById('form-block').style.display='none';
  document.getElementById('s-regnum').textContent=regNum;
  const rows=[
    ['ОВОГ, НЭР',d.lastname+' '+d.firstname],
    ['УТАС',d.phone],['И-МЭЙЛ',d.email],
    ['БАЙГУУЛЛАГА',d.org],['АЛБАН ТУШААЛ',d.role],
    ['САЛБАР',d.sector],['ОРОЛЦОХ ХЭЛБЭР',d.participate],
    ['БУУДАЛ',d.hotel+(d.hotelCount?' — '+d.hotelCount+' хүн':'')],
  ];
  document.getElementById('s-rows').innerHTML=rows.filter(r=>r[1].trim()).map(([k,v])=>
    `<div class="success-row"><span class="success-row-key">${k}</span><span class="success-row-val">${v}</span></div>`
  ).join('');
  document.getElementById('success-block').style.display='block';
}

// Logo recolor
window.addEventListener('load',()=>{
  const logo=document.getElementById('header-logo');
  if(!logo)return;
  const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{
    const c=document.createElement('canvas');
    c.width=img.naturalWidth;c.height=img.naturalHeight;
    const ctx=c.getContext('2d');ctx.drawImage(img,0,0);
    const d=ctx.getImageData(0,0,c.width,c.height);
    for(let i=0;i<d.data.length;i+=4){
      if(d.data[i+3]>10&&d.data[i]>180&&d.data[i+1]>180&&d.data[i+2]>180){
        d.data[i]=255;d.data[i+1]=255;d.data[i+2]=255;
      }
    }
    ctx.putImageData(d,0,0);logo.src=c.toDataURL('image/png');
  };
  img.src='dsif-logo.png';
});
</script>
</body>
</html>
