                            <script>
                            // Цэсний нуух тохиргоо — #mainmenu бэлэн болсон үед шууд ажиллана
                            (function(){
                              var bp = '';
                              var logoA = document.querySelector('#logo a');
                              if (logoA && logoA.getAttribute('href').indexOf('../') === 0) bp = '../';
                              try {
                                var xhr = new XMLHttpRequest();
                                xhr.open('GET', bp + 'data/menu.json', false);
                                xhr.send();
                                if (xhr.status === 200) {
                                  var items = JSON.parse(xhr.responseText);
                                  var hidden = [];
                                  items.forEach(function(m){ if (!m.visible && m.type !== 'section') hidden.push(m.label); });
                                  if (hidden.length) {
                                    document.querySelectorAll('#mainmenu > li').forEach(function(li){
                                      var a = li.querySelector('a');
                                      if (a && hidden.indexOf(a.textContent.trim()) !== -1) li.style.display = 'none';
                                    });
                                  }
                                }
                              } catch(e){}
                            })();

<script>
(function(){
  var basePath = '';
  var scripts = document.querySelectorAll('script[src*="site-header"]');
  if (scripts.length) {
    var src = scripts[0].getAttribute('src');
    if (src.indexOf('../') === 0) basePath = '../';
  }
  // header.html нь projects/ дотроос ч ачаалагддаг тул path олох
  var links = document.querySelectorAll('#logo a');
  if (links.length) {
    var href = links[0].getAttribute('href');
    if (href && href.indexOf('../') === 0) basePath = '../';
  }
  var container = document.getElementById('mega-categories');
  if (!container) return;
  fetch(basePath + 'data/categories.json')
    .then(function(r){ return r.json(); })
    .then(function(cats){
      // Админаас шинэ ангилал нэмсэн бол HTML-г шинэчлэх
      container.innerHTML = '';
      cats.forEach(function(cat){
        var col = document.createElement('div');
        col.className = 'col-lg-2 col-md-4 col-sm-6 text-center';
        col.innerHTML =
          '<a class="mega-cat-card" href="' + basePath + 'tusul.html?cat=' + cat.key + '">' +
            '<div class="relative hover text-center overflow-hidden soft-shadow rounded-1">' +
              '<img src="' + (cat.image.indexOf('http') === 0 ? cat.image : basePath + cat.image) + '" class="w-100 relative hover-scale-1-1" alt="' + cat.name + '">' +
            '</div>' +
            '<h6 class="mt-3">' + cat.name.toUpperCase() + '</h6>' +
          '</a>';
        container.appendChild(col);
      });
    })
    .catch(function(e){ /* fallback: HTML дахь анхны ангилалууд хэвээрээ */ });
})();
</script>
