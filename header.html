<header class="transparent">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="de-flex">
                    <div class="de-flex-col">
                        <!-- logo begin -->
                        <div id="logo">
                            <a href="index.html">
                                <img class="logo-main" src="images/logo.webp" alt="">
                                <img class="logo-scroll" src="images/logo.webp" alt="">
                                <img class="logo-mobile" src="images/logo.webp" alt="">
                            </a>
                        </div>
                        <!-- logo close -->
                    </div>

                    <div class="de-flex-col">
                        <div class="de-flex-col header-col-mid">
                            <ul id="mainmenu">
                                <li><a class="menu-item" href="index.html#section-about">ЗОРИЛГО</a></li>
                                <li><a class="menu-item" href="tusul.html">ТӨСӨЛ</a>
                                    <ul class="mega">
                                        <li>
                                            <div class="container">
                                                <div class="sb-menu p-4">
                                                    <div class="row g-3" id="mega-categories">
                                                        <!-- categories.json-аас динамикаар ачаална -->

                                                        <style>
                                                          .mega-cat-card {
                                                            display: block;
                                                            color: inherit !important;
                                                            text-decoration: none !important;
                                                            text-align: center;
                                                            padding: 10px;
                                                            border-radius: 14px;
                                                            border: 2px solid transparent;
                                                            transition: background .12s ease, border-color .12s ease, box-shadow .12s ease;
                                                          }
                                                          .mega-cat-card > .relative {
                                                            border-radius: 10px !important;
                                                            overflow: hidden;
                                                          }
                                                          .mega-cat-card .hover-scale-1-1 { transition: transform .18s ease; }
                                                          .mega-cat-card:hover .hover-scale-1-1 { transform: scale(1.08); }
                                                          .mega-cat-card:hover,
                                                          .mega-cat-card:focus,
                                                          .mega-cat-card:focus-visible,
                                                          #mainmenu .mega-cat-card:hover {
                                                            background: #4bac48 !important;
                                                            border-color: #4bac48 !important;
                                                            box-shadow: 0 4px 20px rgba(75,172,72,0.4) !important;
                                                            outline: none;
                                                          }
                                                          .mega-cat-card:hover h6,
                                                          .mega-cat-card:focus h6,
                                                          #mainmenu .mega-cat-card:hover h6 {
                                                            color: #ffffff !important;
                                                          }
                                                          .mega-cat-card h6 {
                                                            transition: color .12s ease;
                                                            text-align: center;
                                                            margin-bottom: 0;
                                                          }
                                                        </style>

                                                    </div>
                                                </div>
                                            </div>
                                        </li>
                                    </ul>
                                </li>
                                <li><a class="menu-item" href="index.html#section-schedule">ХӨТӨЛБӨР</a></li>
                                <li><a class="menu-item" href="index.html#section-venue">БАЙРШИЛ</a></li>
                                <li><a class="menu-item" href="sudalgaa.html">СУДАЛГАА</a></li>
                            </ul>
                        </div>
                    </div>

                    <div class="de-flex-col">
                        <button id="theme-toggle" title="Toggle dark/light mode">&#9788;</button>
                        <a href="admin/index.html" title="Админ нэвтрэх" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.15);color:#fff;font-size:16px;text-decoration:none;transition:background .3s;vertical-align:middle;">
                            <i class="fa fa-user-shield"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script>
(function(){
  var basePath = '';
  var scripts = document.querySelectorAll('script[src*="site-header"]');
  if (scripts.length) {
    var src = scripts[0].getAttribute('src');
    if (src.indexOf('../') === 0) basePath = '../';
  }
  // header.html нь projects/ дотроос ч ачаалагддаг тул path олох
  var links = document.querySelectorAll('#logo a');
  if (links.length) {
    var href = links[0].getAttribute('href');
    if (href && href.indexOf('../') === 0) basePath = '../';
  }
  var container = document.getElementById('mega-categories');
  if (!container) return;
  fetch(basePath + 'data/categories.json')
    .then(function(r){ return r.json(); })
    .then(function(cats){
      cats.forEach(function(cat){
        var col = document.createElement('div');
        col.className = 'col-lg-2 col-md-4 col-sm-6 text-center';
        col.innerHTML =
          '<a class="mega-cat-card" href="' + basePath + 'tusul.html?cat=' + cat.key + '">' +
            '<div class="relative hover text-center overflow-hidden soft-shadow rounded-1">' +
              '<img src="' + basePath + cat.image + '" class="w-100 relative hover-scale-1-1" alt="' + cat.name + '">' +
            '</div>' +
            '<h6 class="mt-3">' + cat.name.toUpperCase() + '</h6>' +
          '</a>';
        container.appendChild(col);
      });
    })
    .catch(function(e){ console.warn('Categories load failed:', e); });
})();
</script>
</header>
